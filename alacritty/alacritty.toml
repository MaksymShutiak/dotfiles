
[env]
TERM = "xterm-256color"

[font]
size = 18.0

[font.bold]
family = "JetBrainsMonoNL Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMonoNL Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMonoNL Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMonoNL Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 5

[window]
decorations = "Full"
dynamic_padding = false
opacity = 1.0
startup_mode = "Maximized"

[general]
import = ["/Users/ext-maksym.shutiak/.config/alacritty/tokyo-night.toml"]
